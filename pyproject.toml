[project]
name = "app"
version = "0.1.0"
description = "Issues -> pipeline -> Typesense vector search -> recommendations -> forward API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "typesense",
    "httpx",
    "pydantic",
    "sentence-transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]